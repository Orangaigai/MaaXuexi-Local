name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-runtime.lock.txt
      - name: Install locked runtime
        run: python -m pip install -r backend/requirements-runtime.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Check public files and manifest
        run: python scripts/Check-Publication.py
      - name: Offline regression (no emulator, no API credentials)
        run: python -m unittest discover -s tests -p "test_*.py" -q
